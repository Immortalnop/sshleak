[project]
name = "sshleak"
version = "0.1.0"
description = "Passive, local detector for SSH keystroke timing and size leaks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
    "typer>=0.12,<0.16",
    "click>=8.1,<9",
    "pydantic>=2.6",
    "rich>=13.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "psutil>=5.9",
]

[project.scripts]
sshleak = "sshleak.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "dpkt>=1.9.8",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sshleak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs Docker and the sshleak lab image",
    "slow: long-running (soak, matrix)",
    "nightly: fuzzing runs",
]
addopts = "-m 'not docker and not slow and not nightly'"
